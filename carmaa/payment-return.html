<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>وضعیت پرداخت | CarMaa</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#eef3fb;font:16px/1.8 system-ui,sans-serif;padding:22px}.box{width:min(100%,520px);padding:28px;border:1px solid #283346;border-radius:24px;background:linear-gradient(160deg,#172236,#111620);text-align:center;box-shadow:0 22px 70px #0007}.icon{font-size:42px}.muted{color:#9eabc0}.status{margin:20px 0;padding:14px;border:1px solid #29364a;border-radius:14px}.link{display:inline-block;margin-top:8px;padding:10px 18px;border-radius:12px;background:#9bc1ff;color:#101725;text-decoration:none;font-weight:800}</style></head>
<body><main class="box"><div id="icon" class="icon">◌</div><h1 id="title">در حال بررسی پرداخت</h1><p id="message" class="muted">وضعیت از سرور و درگاه بررسی می‌شود؛ پارامترهای صفحه به‌تنهایی نشانهٔ موفقیت نیستند.</p><div id="order" class="status" hidden></div><a class="link" href="/">بازگشت به کارما</a></main>
<script>
(async function(){
 const params=new URLSearchParams(location.search), orderId=params.get('order_id'), status=params.get('status');
 const title=document.getElementById('title'), message=document.getElementById('message'), icon=document.getElementById('icon'), order=document.getElementById('order');
 function show(t,m,i){title.textContent=t;message.textContent=m;icon.textContent=i;}
 if(!orderId){
   if(status==='cancelled')show('پرداخت لغو شد','پرداخت تکمیل نشد و خدمتی فعال نشده است.','↩');
   else show('وضعیت پرداخت نامشخص است','از بخش مدیریت آگهی، وضعیت سفارش را دوباره بررسی کنید.','!');
   return;
 }
 try{
   const base=window.CARMA_API_BASE||'/api/v1';
   const response=await fetch(base+'/payments/orders/'+encodeURIComponent(orderId),{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}});
   const data=await response.json().catch(()=>null);
   if(!response.ok||!data?.order){show('وضعیت سفارش قابل دریافت نیست','با همان حسابی وارد شوید که پرداخت را شروع کرده است؛ سپس وضعیت سفارش را دوباره بررسی کنید.','!');return;}
   const o=data.order;order.hidden=false;order.textContent='شماره سفارش: '+o.id+' · مبلغ: '+new Intl.NumberFormat('fa-IR').format(Number(o.amount_toman||0))+' تومان';
   if(o.status==='paid')show('پرداخت با موفقیت تأیید شد','درگاه توسط سرور بررسی شده و وضعیت سفارش پرداخت‌شده است.','✓');
   else if(o.status==='pending')show('پرداخت هنوز در حال بررسی است','هنوز تأیید نهایی از درگاه دریافت نشده؛ دوباره از صفحه مدیریت آگهی وضعیت را بررسی کنید.','◌');
   else if(o.status==='expired')show('مهلت پرداخت تمام شده','این سفارش منقضی است و هیچ خدمتی از آن فعال نمی‌شود.','×');
   else show('پرداخت تأیید نشد','سفارش در وضعیت '+o.status+' است؛ هیچ خدمتی بدون تأیید سرور فعال نمی‌شود.','×');
 }catch(_){show('اتصال برقرار نشد','به سرور متصل نشدیم. کمی بعد وضعیت سفارش را از حساب خود بررسی کنید.','!');}
})();
</script>
</body></html>
